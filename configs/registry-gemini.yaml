# Gemini native-API registry (transport: gemini-native) — six vlm-chat candidates.
#
# ── WHY A SEPARATE TRANSPORT, NOT `openai-compat` ────────────────────────────────────────────
# `configs/registry.yaml` already has `gemini-3.5-flash@google-vlmchat` on the OpenAI-compat shim,
# and that entry stays. These entries exist because ONE parameter — `mediaResolution`, the image
# detail budget — is unreachable through that shim, and leaving it unset silently confounds any
# comparison spanning Gemini generations. Measured live 2026-08-05 on one 1275x1650 render, image
# tokens only (total minus a 92-token text baseline):
#
#     generation   default             at MEDIA_RESOLUTION_HIGH
#     3.x          1161  (= HIGH)      1161
#     2.5           317  (= MEDIUM)    1865
#
# A 2.5 model on defaults is handed ~1/4 the image budget of a 3.x model. On a CHECKBOX benchmark,
# where the signal can be a few dark pixels in a small box, that is not a footnote — a 2.5-vs-3.x
# gap measured on defaults partly measures image budget, not model capability. Every row here is
# served at MEDIA_RESOLUTION_HIGH, folded into the condition hash, so image detail is a pinned
# condition rather than a per-generation accident.
#
# Not fixable by re-rendering: the budget is FIXED, not resolution-derived — token count was
# identical across a 4x downscale (1275x1650 -> 318x412 all reported the same count).
#
# Not reachable via the compat shim: five spellings/nestings all returned
# `400 Unknown name "media_resolution" at 'extra_body.google'`. The probe is sound rather than
# unlucky — `thinking_config` at that same path IS accepted (it fails on the VALUE), proving the
# path resolves and this field simply is not a member.
#
# ── CONTAMINATION: FOUR OF SIX ARE FLAGGED ──────────────────────────────────────────────────
# CONTAMINATION_CUTOFF is 2026-05-24 (RealDoc-Bench's HF createdAt — first public availability).
# Release dates below are Wikipedia's Gemini version history, the only source that carries them:
# ai.google.dev's model page and deepmind.google list no dates at all (checked 2026-08-05). They
# are therefore "verified-as-published-third-party", NOT vendor-confirmed — a reader recomputing
# `entry.contaminated` should know the input is a secondary source.
#
#     gemini-2.5-flash-lite    2025-06-17   clean  (11 months pre-cutoff)
#     gemini-2.5-flash         2025-04-17   clean
#     gemini-2.5-pro           2025-03-25   clean
#     gemini-3.1-pro-preview   2026-02-19   clean  (3 months pre-cutoff)
#     gemini-3.5-flash-lite    2026-07-21   CONTAMINATED (2 months post-cutoff)
#     gemini-3.6-flash         2026-07-21   CONTAMINATED (2 months post-cutoff)
#
# So the 2.5 tier and 3.1-pro are legitimate comparative rows; the two newest 3.x models are
# ceiling anchors only and must never be presented as clean baselines. `report.md` stamps
# `contaminated: yes` on them automatically.
#
# ── gemini-3.6-flash IS ALSO THE PINNED EXTRACTOR ───────────────────────────────────────────
# `score.py`'s DEFAULT_MODEL is `gemini-3.6-flash` (divergence D11 rev 3). For these VLM-CHAT rows
# that is harmless — the vlm-chat leg answers directly and never invokes the extractor. It would
# matter for a TRANSCRIBER-shape 3.6-flash entry (the model would grade its own transcripts); there
# is deliberately no such entry here.
#
# ── PRICING: PUBLISHED PAID-TIER RATES, RETRIEVED 2026-08-05 ────────────────────────────────
# From ai.google.dev/gemini-api/docs/pricing. Unlike the Bedrock registry (unpriced because
# Converse returns no cost field and pricing:GetProducts is IAM-denied), Google publishes rates, so
# these entries are priced and `--dry-run`/`--max-spend` work normally.
# NB the two Pro models are TIERED by prompt length: the rates below are the <=200k-token tier,
# which is the only tier this corpus reaches (worst observed prompt ~2.5k tokens, three orders of
# magnitude under the threshold). The >200k tier (3.1-pro $4/$18, 2.5-pro $2.50/$15) is therefore
# unreachable here and is recorded in this comment rather than in the entries.
# Batch and Flex tiers are 50% off standard; not used, since batch changes latency semantics.
#
# ── PRECISION ───────────────────────────────────────────────────────────────────────────────
# `provider-default` on every entry: Google documents no serving precision for these checkpoints.
# This is a declaration of "not asserted" (renders as such in report.md), never a claim of bf16.
# Treat every row here as a serving-stack measurement, not a clean weights comparison.

# ── 2.5 tier (all pre-cutoff, all clean) ────────────────────────────────────────────────────
- id: gemini-2.5-flash-lite@google-native
  shape: vlm-chat
  transport: gemini-native
  model: gemini-2.5-flash-lite
  api_key_env: GEMINI_API_KEY
  precision: provider-default
  pricing:
    input_per_mtok: 0.10
    output_per_mtok: 0.40
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "Google AI paid tier: inputs not used for training (ai.google.dev/gemini-api/terms)"
  provenance: Google
  release_date: "2025-06-17"           # Wikipedia Gemini version history; vendor docs list no date

