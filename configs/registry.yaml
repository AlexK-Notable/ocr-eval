# One entry per (model, serving) pair. api_key_env names the env var; values never live here.
#
# Facts below verified 2026-08-02 against:
#   - HF model card API: https://huggingface.co/api/models/<org>/<name> (createdAt, license tag)
#   - OpenRouter model + endpoint listings: https://openrouter.ai/api/v1/models,
#     https://openrouter.ai/api/v1/models/<id>/endpoints
#   - Public announcements (web search) for closed models with no HF card.
#   - gate3-conclusion-ranking.md (provider ToS findings, referenced inline where used).
#
# Corrections applied to the task-2-brief.md seed's month-level placeholders/guesses:
#   - qwen3-vl-8b-instruct, qwen3-vl-32b-instruct, qwen3.5-9b release dates corrected to
#     exact HF createdAt.
#   - dots.ocr HF id redirect-corrected: rednote-hilab/dots.ocr -> dots-studio/dots.ocr
#     (org renamed/moved on HF; license:mit and weights unchanged).
#   - glm-ocr release date corrected to HF createdAt (zai-org/GLM-OCR, license:mit confirmed).
#   - gemini-3.5-flash, mistral-ocr release dates corrected to public announcement dates
#     (approximate — closed models, no HF card).
#   - qwen3.5-9b provider_pin corrected: Alibaba does not serve this model on OpenRouter at
#     all; repinned to DeepInfra on ToS grounds (see that entry for the rationale).

- id: qwen3-vl-8b@openrouter
  shape: vlm-chat
  transport: openai-compat
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3-vl-8b-instruct
  api_key_env: OPENROUTER_API_KEY
  precision: provider-default          # resolved provider recorded per row
  provider_pin: {order: ["Alibaba"], allow_fallbacks: false}   # verified: "Alibaba" is the exact
                                        # first-party endpoint provider_name on OpenRouter (fp8)
  weights_licence: apache-2.0          # verified via HF Qwen/Qwen3-VL-8B-Instruct license tag
  provider_tos_commercial: ok
  provenance: Alibaba
  release_date: "2025-10-11"           # HF createdAt (Qwen/Qwen3-VL-8B-Instruct)

- id: qwen3.5-9b@openrouter
  # NOTE: all Stage 1 vlm-chat candidates predate the dataset — the contamination flag is
  # exercised by mistral-ocr@mistral (transcriber); flag logic is shape-independent.
  shape: vlm-chat
  transport: openai-compat
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.5-9b
  api_key_env: OPENROUTER_API_KEY
  precision: provider-default
  provider_pin: {order: ["DeepInfra"], allow_fallbacks: false}
    # CORRECTED from seed's ["Alibaba"]: verified via GET .../qwen/qwen3.5-9b/endpoints that
    # Alibaba does NOT serve this model on OpenRouter at all — only third-party: SiliconFlow
    # $0.10/$0.15, DeepInfra $0.10/$0.15, Venice $0.10/$0.15, Parasail $0.10/$0.25, Together
    # $0.17/$0.25 per Mtok.
    #
    # DeepInfra pinned on ToS grounds per gate3-conclusion-ranking.md Part 2: DeepInfra has
    # "the cleanest commercial ToS found" ("You may use the Services for any legal commercial
    # purposes unless specifically prohibited below"). SiliconFlow (international) is
    # disqualified outright — its ToS §3.4(p) "bars any commercial purposes". Together bars
    # transmitting financial/medical/sensitive personal data, which document OCR routinely
    # does. Venice and Parasail were not assessed in the survey; DeepInfra is the only
    # affirmatively-cleared option among the five, not merely the cheapest.
  weights_licence: apache-2.0          # verified via HF Qwen/Qwen3.5-9B license tag
  provider_tos_commercial: ok
  tos_note: >-
    pinned DeepInfra: cleanest commercial ToS in survey; SiliconFlow barred
    (no commercial use), Together bars sensitive-data transmission
  provenance: Alibaba
  release_date: "2026-02-27"           # HF createdAt (Qwen/Qwen3.5-9B). CORRECTED from seed's
                                        # placeholder "2026-02-01" + seed comment claiming a
                                        # contamination flag — verified release_date (2026-02-27)
                                        # is BEFORE CONTAMINATION_CUTOFF; NOT flagged.

- id: gemini-3.5-flash@google
  shape: transcriber
  transport: upstream-parser
  upstream_parser: gemini_3_5_flash    # confirmed registered: `uv run realdoc-bench evaluate list`
  api_key_env: GEMINI_API_KEY
  precision: provider-default
  weights_licence: closed              # ceiling anchor — non-candidate, flagged in report
  provider_tos_commercial: ok
  provenance: Google
  release_date: "2026-05-19"           # approximate — closed model, no HF card. GA announcement
                                        # at Google I/O 2026 (web-verified: ai.google.dev changelog,
                                        # simonwillison.net/2026/May/19/gemini-35-flash). CORRECTED
                                        # from seed placeholder "2026-03-01".

