- id: qwen3.5-9b@openrouter-transcriber
  shape: transcriber
  transport: openai-compat
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.5-9b
  api_key_env: OPENROUTER_API_KEY
  precision: provider-default
  provider_pin: {order: ["DeepInfra"], allow_fallbacks: false}   # ToS grounds — see the
                                        # qwen3.5-9b@openrouter entry above for the full rationale
  pricing: {input_per_mtok: 0.100, output_per_mtok: 0.150}
  reasoning: {max_tokens: 4096}          # THINKING MODEL. Caps reasoning at 4k inside the
                                          # condition's 16k completion budget, leaving 12k for the
                                          # answer. Uncapped, thinking consumed the whole
                                          # allowance and returned empty content — measured
                                          # 2026-08-04: ~15% of this entry's first 153 direct
                                          # cells came back error_class "empty", and its
                                          # transcriber smoke produced a 9-byte transcript on a
                                          # dense page. Verified via the OpenRouter models API
                                          # that this is the only Qwen entry advertising
                                          # reasoning/include_reasoning; do not copy this field
                                          # onto the -instruct entries, which would risk a 400.
  weights_licence: apache-2.0
  provider_tos_commercial: ok
  tos_note: >-
    pinned DeepInfra: cleanest commercial ToS in survey; SiliconFlow barred
    (no commercial use), Together bars sensitive-data transmission
  provenance: Alibaba
  release_date: "2026-02-27"           # HF createdAt (Qwen/Qwen3.5-9B)
  # ⚠ REASONING MODEL — smoke this one before committing to a full 581-page parse.
  # Verified 2026-08-04 via GET openrouter.ai/api/v1/models: this is the ONLY one of the three
  # Qwen entries exposing `reasoning`/`include_reasoning` (the two -instruct VL models expose
  # neither). TRANSCRIBER_CONDITION pins max_tokens=4096, and a model that spends that budget on
  # reasoning returns an empty or truncated transcript — the exact failure this repo already hit
  # on the local ctx8k run (see docs/api.md, "Empty transcripts from thinking transcribers").
  # `ocr-eval parse` DOES fail closed on it (the md_length <= 16 chars/page gate), but only after
  # the pages are paid for. Parse with --limit first and read the transcripts.

