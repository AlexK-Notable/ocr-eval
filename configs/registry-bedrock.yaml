# AWS Bedrock registry (transport: bedrock-converse).
#
# Auth is the AWS credential chain (SigV4) — there is no api_key_env, and entries that declare one
# are REJECTED by RegistryEntry's validator. Bedrock exposes no OpenAI-compatible endpoint
# reachable from this account (probed 2026-08-04: /openai/v1/models -> 404 UnknownOperationException,
# bedrock-runtime advertises no chat-completions op, get-api-key not permitted, unauthenticated
# POST -> 403), so these cannot be openai-compat entries pointed at a different base_url.
#
# `region` is REQUIRED and never inherited from AWS_REGION: it is part of the serving identity
# stamped on every row (resolved_provider = "bedrock:<region>"), and report_md.py's D4 gate
# hard-fails a parser key whose rows span more than one provider — so a run accidentally split
# across regions is caught rather than silently averaged.
#
# ── modelId vs inference profile ─────────────────────────────────────────────────────────────
# Bedrock has two invocation identities and `list-foundation-models` does not tell you which to
# use directly. Models whose inferenceTypesSupported is ON_DEMAND take the bare modelId
# (`amazon.nova-lite-v1:0`); models marked INFERENCE_PROFILE are NOT invokable by their bare id
# and require the geo-prefixed cross-region profile id (`us.anthropic.claude-haiku-...`). Getting
# this wrong surfaces as ValidationException or AccessDeniedException, not as a helpful hint —
# always `ocr-eval preflight <id>` before spending.
#
# ── ACCESS IS PER-ROLE, NOT PER-ACCOUNT ──────────────────────────────────────────────────────
# Verified live 2026-08-04 on account 381492199098 as AWSReservedSSO_Developer: 119 vision-capable
# models are LISTED, only 7 are INVOKABLE by this role. Every entry below was confirmed invokable
# AND confirmed to read checkbox polarity correctly on a synthetic form (checked box -> true,
# empty box -> false, name transcribed). Models denied to this role at that time — do not add
# without re-probing: all bare `anthropic.*` ids, `us.amazon.nova-2-lite-v1:0`,
# `us.amazon.nova-premier-v1:0`, `us.meta.llama4-*`, `us.mistral.pixtral-large-*`.
#
# ── PRICING: THE ANTHROPIC ENTRIES ONLY, AND FROM A SINGLE SOURCE (2026-08-11) ────────────────
# Bedrock's Converse response carries token counts but NO cost field (unlike OpenRouter's
# usage.cost), and `pricing:GetProducts` is denied to this role, so a rate can only come from
# outside this environment. The two Anthropic entries now carry one, read off the vendor's own
# pricing page on 2026-08-11 (see each entry). The Amazon and Google entries remain UNPRICED,
# which has two honest consequences for them:
#   * `direct --dry-run` counts their cells under `unpriced_cells` and EXCLUDES them from
#     `estimated_usd` (never folded in as $0).
#   * `direct --max-spend N` FAILS CLOSED on them (run_direct's track() raises rather than
#     treating an unknowable cost as free).
#
# ⚠ THE ANTHROPIC RATES HAVE ONE SOURCE, NOT TWO. The registry.yaml convention is two independent
# sources agreeing exactly (Google's pricing page + OpenRouter's API, for the Gemini rows). That is
# not achievable here, and the attempt is recorded rather than hidden:
#   * AWS's PUBLIC Price List bulk API — no auth, no IAM (unlike `pricing:GetProducts`) — was
#     fetched for us-east-1 at publication 2026-08-11T16:17:54Z. It carries 1,014 rate rows and
#     FIVE Anthropic rows, all legacy: Claude Instant, 2.0, 2.1, 3 Haiku, 3 Sonnet. There is no
#     Claude 4.x or 5 row of any kind, input or output. Re-check with
#     `scripts/bedrock-price-list-claude.sh` — if AWS ever publishes them, that is the second
#     source and it should be added here.
#   * The pricing page's Anthropic table also does not survive automated extraction: two WebFetch
#     passes over aws.amazon.com/bedrock/pricing/ returned only the two "Public Extended Access"
#     Claude 3.5 Sonnet rows, so the figures below were read off the rendered page by the user.
# Both Anthropic rates below are exactly 1.10x Anthropic's first-party list price. That constant
# partner premium holds across the whole published table (Opus 5 $5.50/$27.50 vs $5.00/$25.00,
# Sonnet 4.6 $3.30/$16.50 vs $3.00/$15.00, Haiku 4.5 $1.10/$5.50 vs $1.00/$5.00), which is
# corroboration of the SHAPE of the number, not an independent measurement of it.
#
# ── COMPARABILITY ────────────────────────────────────────────────────────────────────────────
# `precision: provider-default` on every entry: Bedrock does not document the serving precision of
# these checkpoints, so this is a declaration of "not asserted" (renders as such in report.md),
# never a claim of bf16. Per the spec's precision policy, treat a Bedrock row as a serving-stack
# measurement, not a clean weights comparison against a locally-served BF16 row.

- id: nova-lite@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: amazon.nova-lite-v1:0        # ON_DEMAND — bare modelId is correct, no us. prefix
  region: us-east-1
  precision: provider-default        # Bedrock does not document serving precision
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "AWS Bedrock: no training on customer inputs by default (AWS service terms)"
  provenance: Amazon
  release_date: "2024-12-03"         # Nova family GA, re:Invent 2024 — pre-dataset

- id: nova-pro@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: amazon.nova-pro-v1:0        # ON_DEMAND
  region: us-east-1
  precision: provider-default
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "AWS Bedrock: no training on customer inputs by default (AWS service terms)"
  provenance: Amazon
  release_date: "2024-12-03"

# INFERENCE_PROFILE model: the bare `anthropic.claude-haiku-4-5-...` id is NOT invokable — the
# `us.` cross-region profile prefix is required. Confirmed invokable by this role 2026-08-04.
- id: claude-haiku-4.5@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  region: us-east-1
  precision: provider-default
  pricing: {input_per_mtok: 1.10, output_per_mtok: 5.50}       # "Claude 4.5 Haiku" row, Anthropic
                                      # on-demand table, aws.amazon.com/bedrock/pricing/, retrieved
                                      # 2026-08-11. SINGLE SOURCE — see the pricing block in this
                                      # file's header for the cross-check that was attempted and
                                      # could not be completed. Applying it to the 1,336 rows that
                                      # carry usage (2,252,308 in / 71,464 out) prices the completed
                                      # leg at $2.8706; the other 20 of 1,356 cells are api_error
                                      # rows with no usage recorded, so they are not in that figure.
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "AWS Bedrock: no training on customer inputs by default (AWS service terms)"
  provenance: Anthropic
  release_date: "2025-10-01"         # from the model id's own date component

# Added 2026-08-11. Probed live for invokability by THIS role in us-east-1 before adding, because
# listed != invokable here (see the per-role block above). Result of that probe, so it does not
# have to be repaid:
#   us.anthropic.claude-sonnet-4-6                  -> ok
#   us.anthropic.claude-sonnet-4-5-20250929-v1:0    -> ok
#   us.anthropic.claude-sonnet-5                    -> AccessDeniedException (denied to this role;
#                                                      do not add without re-probing)
#   us.anthropic.claude-sonnet-4-20250514-v1:0      -> ResourceNotFoundException
# 4.6 is chosen over 4.5 because they price identically ($3.30/$16.50) and both pre-date
# CONTAMINATION_CUTOFF (2026-05-24), so the newer one costs nothing extra in either money or
# contamination risk.
#
# NOT A THINKING ROW. Extended thinking on Bedrock is opt-in via `additionalModelRequestFields`,
# which this transport does not send, and a live probe at temperature 0.0 / maxTokens 12288 returned
# a single `text` block, no `reasoningContent`, and inputTokens+outputTokens == totalTokens exactly.
# Enabling thinking would ALSO require temperature 1.0 for Anthropic models, which STAGE1_CONDITION
# does not pin — so a thinking variant is a different condition, not a flag on this entry.
- id: claude-sonnet-4.6@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: us.anthropic.claude-sonnet-4-6      # INFERENCE_PROFILE — bare `anthropic.` id is not invokable
  region: us-east-1
  precision: provider-default
  pricing: {input_per_mtok: 3.30, output_per_mtok: 16.50}      # "Claude Sonnet 4.6" row, same table,
                                      # same retrieval date, same single-source caveat as above.
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "AWS Bedrock: no training on customer inputs by default (AWS service terms)"
  provenance: Anthropic
  release_date: "2025-11-14"          # from the first-party model id's date component
                                      # (claude-sonnet-4-6-20251114); the Bedrock id carries none.

- id: gemma-3-27b@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: google.gemma-3-27b-it       # ON_DEMAND
  region: us-east-1
  precision: provider-default
  weights_licence: gemma             # Gemma Terms of Use — NOT OSI open source; review before
                                      # treating this as an open-weight candidate row
  provider_tos_commercial: conditional
  tos_note: "Gemma Terms of Use apply to outputs/derivatives; review before commercial reporting"
