- id: claude-haiku-4.5@bedrock
  shape: vlm-chat
  transport: bedrock-converse
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  region: us-east-1
  precision: provider-default
  weights_licence: closed
  provider_tos_commercial: ok
  tos_note: "AWS Bedrock: no training on customer inputs by default (AWS service terms)"
